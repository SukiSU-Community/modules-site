<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>人机校验 · 酷模</title>
    <link rel="stylesheet" href="./fonts/fonts.css" />
    <style>
      /* 独立的令牌页：不引用 panel.css，避免站点改版时牵连 App 内嵌页。
         配色仍取站点同一套琥珀 / 深空读数，只留这一屏要用的几个值。 */
      :root {
        color-scheme: dark;
        --void: #07080b;
        --panel: #0e1117;
        --panel-2: #12161e;
        --line: #1d232e;
        --line-2: #2b3442;
        --ink: #e9ecf3;
        --ink-2: #98a3b5;
        --ink-3: #5f6a7b;
        --amber: #ffb020;
        --amber-wash: rgba(255, 176, 32, 0.1);
        --amber-line: rgba(255, 176, 32, 0.36);
        --mint: #4fd9a4;
        --red: #ff5f57;
        --red-wash: rgba(255, 95, 87, 0.12);
        --red-line: rgba(255, 95, 87, 0.4);
        --red-ink: #ffd9d6;
        --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
        --sans: "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Source Han Sans SC",
          "Noto Sans SC", "Microsoft YaHei", sans-serif;
      }
      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --void: #f5f3ee;
          --panel: #fffefb;
          --panel-2: #f7f5f0;
          --line: #e4dfd3;
          --line-2: #cfc7b6;
          --ink: #1b1a17;
          --ink-2: #55514a;
          --ink-3: #8a8478;
          --amber: #8f5500;
          --amber-wash: rgba(255, 176, 32, 0.18);
          --amber-line: rgba(143, 85, 0, 0.38);
          --mint: #127a58;
          --red: #b3261e;
          --red-wash: rgba(179, 38, 30, 0.08);
          --red-line: rgba(179, 38, 30, 0.34);
          --red-ink: #7a1a14;
        }
      }

      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        margin: 0;
      }
      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(20px, env(safe-area-inset-top)) 16px
          max(20px, env(safe-area-inset-bottom));
        background: var(--void);
        color: var(--ink);
        font-family: var(--sans);
        -webkit-text-size-adjust: 100%;
      }

      .card {
        width: min(420px, 100%);
        padding: 22px 20px 18px;
        border: 1px solid var(--line-2);
        border-radius: 6px;
        background: var(--panel);
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.35);
        position: relative;
        overflow: hidden;
      }
      .card::before {
        content: "";
        position: absolute;
        inset: 0 0 auto;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--amber), transparent);
        opacity: 0.55;
      }

      .eyebrow {
        margin: 0 0 10px;
        font: 500 10.5px/1.4 var(--mono);
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--ink-3);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        line-height: 1.35;
        font-weight: 650;
      }
      .lede {
        margin: 0;
        font-size: 13.5px;
        line-height: 1.75;
        color: var(--ink-2);
      }

      .notice {
        margin: 14px 0 0;
        padding: 10px 12px;
        border: 1px solid var(--red-line);
        border-radius: 4px;
        background: var(--red-wash);
        color: var(--red-ink);
        font-size: 14px;
        font-weight: 600;
        line-height: 1.6;
      }
      .notice small {
        display: block;
        margin-top: 2px;
        font-size: 12px;
        font-weight: 400;
        color: var(--ink-2);
      }

      .slot {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 65px;
        margin: 22px 0 10px;
      }
      .slot:empty::after {
        content: "";
        width: 22px;
        height: 22px;
        border: 2px solid var(--line-2);
        border-top-color: var(--amber);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .slot:empty::after {
          animation: none;
        }
      }

      .status {
        min-height: 1.5em;
        margin: 0;
        text-align: center;
        font: 400 12.5px/1.6 var(--mono);
        color: var(--ink-3);
      }
      .status.is-ok {
        color: var(--mint);
      }
      .status.is-bad {
        color: var(--red);
      }

      .retry {
        display: block;
        margin: 14px auto 0;
        padding: 10px 22px;
        border: 1px solid var(--amber-line);
        border-radius: 4px;
        background: var(--amber-wash);
        color: var(--amber);
        font: 500 13px/1 var(--sans);
        letter-spacing: 0.04em;
        cursor: pointer;
      }
      .retry:hover {
        border-color: var(--amber);
      }
      .retry:focus-visible {
        outline: 2px solid var(--amber);
        outline-offset: 2px;
      }

      .foot {
        margin: 18px 0 0;
        padding-top: 12px;
        border-top: 1px solid var(--line);
        font: 400 11px/1.7 var(--mono);
        color: var(--ink-3);
      }
    </style>
  </head>
  <body>
    <main class="card" aria-labelledby="ttl">
      <p class="eyebrow">COOL MODULE / TURNSTILE</p>
      <h1 id="ttl">请完成人机校验</h1>
      <p class="lede">
        这是防止机器人批量投稿的一道校验。勾选下面的方框即可，完成后结果会自动交回 App，不用手动返回。
      </p>

      <p class="notice" id="no-bridge" hidden>
        请从 App 打开此页
        <small>本页只供 Android App 内嵌使用；在浏览器里直接打开，校验结果无法交回。</small>
      </p>

      <div class="slot" id="slot"></div>
      <p class="status" id="status" role="status" aria-live="polite">正在加载校验组件…</p>
      <button class="retry" id="retry" type="button" hidden>重新校验</button>

      <p class="foot">
        本页不收集任何信息，只向 Cloudflare 请求一次人机校验。校验令牌一次性使用。
      </p>
    </main>
    <noscript>
      <p style="color: #ff5f57; font-size: 14px">需要启用 JavaScript 才能完成校验。</p>
    </noscript>
    <script type="module" src="./scripts/turnstile-bridge.js"></script>
  </body>
</html>
